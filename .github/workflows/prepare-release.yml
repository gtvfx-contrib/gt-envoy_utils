name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unprefixed Envoy Utils semantic version
        required: true
        type: string
      envoy_version:
        description: Unprefixed published Envoy semantic version to statically link
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-24.04

    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: envoy_utils,envoy

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate Envoy release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENVOY_TAG: v${{ inputs.envoy_version }}
        run: gh release view "$ENVOY_TAG" --repo gtvfx-envoy/envoy --json tagName

      - name: Prepare version and Envoy pin
        run: >-
          python scripts/release_automation.py prepare
          --version "${{ inputs.version }}"
          --envoy-version "${{ inputs.envoy_version }}"

      - name: Test release automation
        run: python -m unittest discover -s tests -p "test_release_automation.py"

      # As in lint.yml: fmt/clippy/test are each independent checks. GitHub
      # Actions runs a multi-line `run:` block via `bash -e`, which aborts
      # the whole script at the first failing line -- so bundling them into
      # one step has the same masking effect as chaining separate steps with
      # no guard. Split into individual steps with `if: ${{ !cancelled() }}`
      # so a release-prep run reports every problem at once instead of one
      # per re-dispatch.
      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo test
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo test --workspace

      - name: Ensure release preparation label exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh label create release-prep --color 5319E7 --force
          --description "Automated release preparation pull request"

      - name: Create or update draft pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/release-v${{ inputs.version }}
          base: main
          commit-message: Prepare v${{ inputs.version }} release
          title: Prepare v${{ inputs.version }} release
          body: |
            Automated Envoy Utils release preparation.

            - Updates the Envoy Utils workspace version.
            - Pins Envoy Core to `v${{ inputs.envoy_version }}` and refreshes Cargo.lock.
            - Runs release-readiness checks.

            Merge only after the normal pull request checks pass.
          labels: release-prep
          draft: always-true
          delete-branch: false
